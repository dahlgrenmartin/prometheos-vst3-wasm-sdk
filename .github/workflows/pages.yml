name: Publish the conformance packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The published packages are fetched by URL from the host's plugin loader, so
# one deployment at a time and never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: 4.0.10
  NINJA_VERSION: 1.11.1.3
  PNPM_VERSION: 9.15.9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pinned Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install pinned pnpm and Ninja
        shell: bash
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          python -m pip install --disable-pip-version-check --target "${RUNNER_TEMP}/ninja" "ninja==${NINJA_VERSION}"
          echo "${RUNNER_TEMP}/ninja/bin" >> "${GITHUB_PATH}"
          echo "pnpm=$(pnpm --version)"
          emcc --version | head -n 1

      # The package targets shell out to the TypeScript prober/packer, so this
      # has to precede the configure step, which checks for it.
      - name: Install the TypeScript tool dependencies
        run: pnpm --dir tools install --frozen-lockfile

      - name: Build both WebVST packages
        shell: bash
        run: |
          cmake -S . -B build/wasm -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$(command -v ninja)" \
            -DCMAKE_TOOLCHAIN_FILE="${EMSDK}/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DWEBVST_BUILD_FIXTURES=ON
          cmake --build build/wasm --target webvst_fixture_package upstream_adelay_webvst_package --parallel

      - name: Verify the pinned upstream source remains untouched
        run: git -C third_party/public.sdk diff --exit-code

      - name: Run the package conformance suite
        run: pnpm --dir tools test:conformance

      - name: Stage the Pages webroot
        shell: bash
        run: |
          mkdir -p _site
          cp build/packages/steinberg-adelay.webvst build/packages/webvst-fixtures.webvst _site/
          cp schema/plugin.schema.json _site/plugin.schema.json
          (cd _site && sha256sum ./*.webvst > SHA256SUMS)
          cat _site/SHA256SUMS
          ADELAY_BYTES="$(stat -c%s _site/steinberg-adelay.webvst)"
          FIXTURES_BYTES="$(stat -c%s _site/webvst-fixtures.webvst)"
          cat > _site/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>WebVST conformance packages</title>
          <h1>WebVST conformance packages</h1>
          <p>Paste a URL below into the Buzz plugin loader's <em>Install URL</em> field.</p>
          <h2>Steinberg ADelay</h2>
          <p>Unmodified upstream VST3 source, compiled through the generic adapter and
          discovered via <code>IPluginFactory</code>. This is the portability proof.</p>
          <p><code>${PAGES_BASE}/steinberg-adelay.webvst</code></p>
          <h2>SDK fixtures</h2>
          <p>The hand-written VST3 instrument and effect pair used by the conformance suite.</p>
          <p><code>${PAGES_BASE}/webvst-fixtures.webvst</code></p>
          <ul>
            <li><a href="steinberg-adelay.webvst">steinberg-adelay.webvst</a> (${ADELAY_BYTES} bytes)</li>
            <li><a href="webvst-fixtures.webvst">webvst-fixtures.webvst</a> (${FIXTURES_BYTES} bytes)</li>
            <li><a href="SHA256SUMS">SHA256SUMS</a></li>
            <li><a href="plugin.schema.json">plugin.schema.json</a></li>
          </ul>
          HTML
        env:
          PAGES_BASE: https://dahlgrenmartin.github.io/prometheos-vst3-wasm-sdk

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    # Only main publishes; pull requests build and verify without deploying.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
